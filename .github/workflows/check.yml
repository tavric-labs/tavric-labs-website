name: Website
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check public/app.js
      - run: bash -n scripts/deploy.sh
      - run: sh -n deploy/publish.sh
      - run: npm run build
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SITE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: website-production
    concurrency:
      group: website-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.SITE_DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.SITE_DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.SITE_DEPLOY_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run build
      - name: Package site
        run: COPYFILE_DISABLE=1 tar -czf "$RUNNER_TEMP/site.tgz" -C dist .
      - name: Configure deployment identity
        env:
          DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.SITE_DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/site-deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
      - name: Publish release
        run: |
          ssh -i "$HOME/.ssh/site-deploy" -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" "publish $GITHUB_SHA" < "$RUNNER_TEMP/site.tgz"
      - name: Verify public HTTPS deployment
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors --max-time 20 https://tavric-labs.net/_deployment.json |
            python3 -c 'import json,os,sys; assert json.load(sys.stdin)["revision"] == os.environ["GITHUB_SHA"]'
          curl --fail --silent --show-error https://tavric-labs.net/ -o /dev/null
      - name: Remove temporary credentials
        if: always()
        run: rm -f "$HOME/.ssh/site-deploy"
